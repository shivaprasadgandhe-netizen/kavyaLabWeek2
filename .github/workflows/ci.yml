name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20]

    env:
      # Placeholder environment variables for build validation (no real secrets stored)
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy_db?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/dummy_db?schema=public"
      AUTH_SECRET: "ci_placeholder_auth_secret_at_least_32_characters"
      AUTH_GOOGLE_ID: "ci_placeholder_google_client_id"
      AUTH_GOOGLE_SECRET: "ci_placeholder_google_client_secret"
      AUTH_URL: "http://localhost:3000"
      AUTH_TRUST_HOST: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js application
        run: npm run build

      - name: Run test suite
        run: npm test
